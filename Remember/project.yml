name: Remember
options:
  bundleIdPrefix: com.iry
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

targets:
  Remember:
    type: application
    platform: iOS
    sources:
      - path: Remember
        excludes:
          - "**/*.md"
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iry.remember
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  RememberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RememberTests
    dependencies:
      - target: Remember
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iry.remembertests
        GENERATE_INFOPLIST_FILE: YES
